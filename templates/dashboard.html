<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Menú lateral -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="/general">📋 General</a></li>
                        <li class="nav-item"><a class="nav-link" href="/cobranza">💰 Cobranza</a></li>
                        <li class="nav-item"><a class="nav-link" href="/suscripciones">📅 Suscripciones</a></li>
                        <li class="nav-item"><a class="nav-link" href="/logout">🚪 Salir</a></li>
                    </ul>
                </div>
            </nav>

            <!-- Contenido principal -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1>Bienvenido, {{ usuario.nombre or usuario.username }}</h1>
                </div>
                {% if es_admin %}
                <div class="alert alert-success">✅ Tienes permisos de administrador</div>
                {% endif %}
                <div class="row">
                    <div class="col-md-4">
                        <div class="card text-white bg-primary mb-3">
                            <div class="card-body">Clientes activos: 124</div>
                        </div>
                    </div>
                    <!-- más widgets -->
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
